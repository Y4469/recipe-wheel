<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To‑Do (localStorage) — משחק הבישול</title>
<style>
:root{--bg:#f7f7fb;--card:#ffffff;--accent:#7b3f24;--muted:#6b7280;--danger:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111}
.wrap{max-width:900px;margin:32px auto;padding:18px}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 8px 22px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:26px}
.subtitle{color:var(--muted);margin-bottom:12px}
.input-row{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;padding:10px;border-radius:8px;border:1px solid #e6e9f2}
.btn{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
.btn.secondary{background:#eef2ff;color:var(--accent);border:1px solid rgba(79,70,229,.08)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.count{margin-left:auto;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.item{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;border:1px solid #f1f3f8;background:#fff}
li.item.done{opacity:.6;text-decoration:line-through;color:var(--muted)}
.editable{width:100%;border:1px solid #e6e9f2;padding:8px;border-radius:6px}
.actions{display:flex;gap:8px}
.small{font-size:12px;color:var(--muted)}
.clear{background:transparent;border:0;color:var(--danger);cursor:pointer}
@media(max-width:520px){.wrap{padding:12px;margin:16px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>📝 רשימת משימות — שמור ב‑localStorage</h1>
    <div class="subtitle">הוסף משימות, סמנן כבוצע, ערוך ומחק — הכל נשמר בדפדפן.</div>

    <div class="input-row">
      <input id="taskInput" type="text" placeholder="כתוב משימה חדשה ולחץ Enter" aria-label="new task">
      <button id="addBtn" class="btn">הוסף</button>
    </div>

    <div class="controls">
      <div class="filters">
        <button class="btn secondary" data-filter="all">הכל</button>
        <button class="btn secondary" data-filter="active">פעילות</button>
        <button class="btn secondary" data-filter="completed">בוצע</button>
      </div>
      <div class="count" id="count">0 פריטים</div>
    </div>

    <ul id="list" class="list"></ul>

    <footer style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <button id="clearCompleted" class="clear">נקה בוצעו</button>
        <button id="clearAll" class="clear">נקה הכל</button>
      </div>
      <div class="small">עצה: הקלק כפול על פריט לעריכה</div>
    </footer>

  </section>
</main>

<script>
const STORAGE_KEY='todo-list:v1';
const el={input:document.getElementById('taskInput'),addBtn:document.getElementById('addBtn'),list:document.getElementById('list'),count:document.getElementById('count'),filters:document.querySelectorAll('[data-filter]'),clearCompleted:document.getElementById('clearCompleted'),clearAll:document.getElementById('clearAll')};
let todos=[];let filter='all';
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw) return;todos=JSON.parse(raw)||[];}catch(e){console.error(e);todos=[]}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(todos))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function countActive(){return todos.filter(t=>!t.done).length}
function render(){const shown=todos.filter(t=>filter==='active'?!t.done:filter==='completed'?t.done:true);el.list.innerHTML='';for(const t of shown){const li=document.createElement('li');li.className='item'+(t.done?' done':'');li.dataset.id=t.id;li.innerHTML=`<input type="checkbox" class="chk" ${t.done?'checked':''} aria-label="mark"> <div class="text" style="flex:1;min-width:0" title="${escapeHtml(t.text)}">${escapeHtml(t.text)}</div><div class="actions"><button class="edit">✏️</button><button class="del">🗑️</button></div>`;li.querySelector('.text').addEventListener('dblclick',()=>startEdit(t.id,li));el.list.appendChild(li)}el.count.textContent=`${countActive()} פעיל / ${todos.length} סה"כ`}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function addTask(text){const trimmed=String(text||'').trim();if(!trimmed) return;todos.unshift({id:uid(),text:trimmed,done:false,created:Date.now()});save();render();el.input.value='';el.input.focus()}
function toggleDone(id){const t=todos.find(x=>x.id===id);if(!t) return;t.done=!t.done;save();render()}
function deleteTask(id){todos=todos.filter(x=>x.id!==id);save();render()}
function startEdit(id,li){const t=todos.find(x=>x.id===id);if(!t) return;const textDiv=li.querySelector('.text');const input=document.createElement('input');input.className='editable';input.value=t.text;input.setAttribute('aria-label','edit task');textDiv.replaceWith(input);input.focus();input.select();function finish(saveEdit){if(saveEdit){const val=input.value.trim();if(val){t.text=val}else{todos=todos.filter(x=>x.id!==id)}}save();render()}input.addEventListener('blur',()=>finish(true),{once:true});input.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();finish(true)}if(ev.key==='Escape'){ev.preventDefault();finish(false)}})}
el.list.addEventListener('click',e=>{const li=e.target.closest('li.item');if(!li) return;const id=li.dataset.id;if(e.target.matches('.chk')){toggleDone(id);return}if(e.target.matches('.del')){if(confirm('למחוק משימה זו?')) deleteTask(id);return}if(e.target.matches('.edit')){startEdit(id,li);return}})
el.input.addEventListener('keydown',e=>{if(e.key==='Enter') addTask(el.input.value)})
el.addBtn.addEventListener('click',()=>addTask(el.input.value))
el.filters.forEach(btn=>{btn.addEventListener('click',()=>{el.filters.forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;render()})})
el.clearCompleted.addEventListener('click',()=>{if(!todos.some(t=>t.done)) return alert('אין משימות שבוצעו.');if(confirm('למחוק את כל המשימות שבוצעו?')){todos=todos.filter(t=>!t.done);save();render()}})
el.clearAll.addEventListener('click',()=>{if(!todos.length) return; if(confirm('למחוק את כל המשימות?')){todos=[];save();render()}})
(function init(){load();render();document.querySelectorAll('[data-filter]').forEach(b=>{if(b.dataset.filter==='all')b.classList.add('active')})})();
</script>
</body>
</html>
